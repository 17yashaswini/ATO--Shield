version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: python run.py

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host

# Note: MongoDB is expected to be provided via MongoDB Atlas (see backend/.env.example).
# Add a local `mongo` service here if you prefer running MongoDB in a container instead.
